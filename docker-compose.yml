version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-common: &healthcheck-common
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 40s

networks:
  autoreply-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

services:
  postgres:
    image: postgres:16-alpine
    container_name: autoreply-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoreply}
      POSTGRES_USER: ${POSTGRES_USER:-autoreply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Compose environment}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoreply} -d ${POSTGRES_DB:-autoreply}"]
      <<: *healthcheck-common
    logging: *default-logging
    networks:
      - autoreply-network

  redis:
    image: redis:7-alpine
    container_name: autoreply-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck-common
    logging: *default-logging
    networks:
      - autoreply-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: bash entrypoint.render.sh
    container_name: autoreply-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoreply}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autoreply}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
      - /app/__pycache__/
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8000/ready",
        ]
      <<: *healthcheck-common
    logging: *default-logging
    networks:
      - autoreply-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autoreply-celery-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoreply}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autoreply}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
      - /app/__pycache__/
    logging: *default-logging
    networks:
      - autoreply-network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autoreply-celery-beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoreply}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autoreply}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
      - /app/__pycache__/
    logging: *default-logging
    networks:
      - autoreply-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ALLOW_SIGNUPS: ${NEXT_PUBLIC_ALLOW_SIGNUPS:-false}
    container_name: autoreply-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    logging: *default-logging
    networks:
      - autoreply-network

  nginx:
    profiles: ["edge"]
    image: nginx:alpine
    container_name: autoreply-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    logging: *default-logging
    networks:
      - autoreply-network
