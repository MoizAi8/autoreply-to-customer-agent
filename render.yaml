services:
  - type: web
    name: autoreply-portfolio-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash entrypoint.render.sh
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: ALLOW_SIGNUPS
        value: "false"
      - key: AI_GENERATION_ENABLED
        value: "false"
